<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro de Usuários</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1d84b5, #0b3141);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    width: min(760px, 100%);
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    padding: 28px;
    backdrop-filter: blur(14px);
  }

  h1 {
    margin: 0 0 10px;
    font-size: 28px;
    text-align: center;
  }

  p {
    margin: 0 0 24px;
    text-align: center;
    opacity: 0.9;
  }

  form {
    display: grid;
    gap: 14px;
    margin-bottom: 24px;
  }

  label {
    font-size: 15px;
    opacity: 0.95;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 12px;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 16px;
  }

  .user-list-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 14px;
    padding: 20px;
  }

  .user-item {
    background: rgba(255,255,255,0.08);
    padding: 14px 16px;
    margin-bottom: 12px;
    border-radius: 12px;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .empty {
    text-align: center;
    opacity: 0.85;
    padding: 24px 0;
  }

  .button-row {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  button {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    background: #2ecc71;
    color: #063919;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: #28b463;
  }

  .danger {
    background: #e74c3c;
    color: white;
  }

  .danger:hover {
    background: #c0392b;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Cadastro de Usuários</h1>
    <p id="userInfo"></p>

    <form id="cadastroForm">
      <div>
        <label for="newUsername">Nome de usuário</label>
        <input type="text" id="newUsername" required>
      </div>
      <div>
        <label for="newPassword">Senha</label>
        <input type="password" id="newPassword" required>
      </div>
      <button type="submit">Cadastrar usuário</button>
    </form>

    <div class="user-list-box">
      <div id="listaUsuarios"></div>
      <div id="noUsers" class="empty">Nenhum usuário cadastrado.</div>
    </div>

    <div class="button-row">
      <button onclick="abrirControle()">Ir para controle</button>
      <button class="danger" onclick="logout()">Sair</button>
    </div>
  </div>

  <script>
    const ownerUsername = 'sherlen';
    const ownerPassword = '98346986';

    function getUsers() {
      try {
        const stored = JSON.parse(localStorage.getItem('controleUsers') || '[]');
        if (!Array.isArray(stored)) return [];
        const normalized = stored.map((item) => {
          if (typeof item === 'string') {
            return { username: item, password: item === ownerUsername ? ownerPassword : '' };
          }
          return {
            username: item.username || '',
            password: item.password || ''
          };
        }).filter(u => u.username);
        localStorage.setItem('controleUsers', JSON.stringify(normalized));
        return normalized;
      } catch {
        return [];
      }
    }

    function saveUsers(users) {
      localStorage.setItem('controleUsers', JSON.stringify(users));
    }

    function initializeUsers() {
      const users = getUsers();
      const ownerExists = users.some(u => u.username === ownerUsername);
      if (!ownerExists) {
        users.push({ username: ownerUsername, password: ownerPassword });
        saveUsers(users);
      }
    }

    function renderUserList() {
      const listaEl = document.getElementById('listaUsuarios');
      const emptyEl = document.getElementById('noUsers');
      const users = getUsers();

      listaEl.innerHTML = '';
      if (!users.length) {
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      users.forEach((user) => {
        const item = document.createElement('div');
        item.className = 'user-item';
        item.innerHTML = `<span>${user.username}</span><span>${user.username === ownerUsername ? 'Proprietário' : 'Acesso'}</span>`;
        listaEl.appendChild(item);
      });
    }

    function showError(message) {
      alert(message);
    }

    function adicionarUsuario(username, password) {
      const users = getUsers();
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        showError('Esse usuário já existe. Use outro nome.');
        return false;
      }
      users.push({ username, password });
      saveUsers(users);
      return true;
    }

    document.getElementById('cadastroForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value;

      if (!username || !password) {
        showError('Preencha usuário e senha.');
        return;
      }

      if (adicionarUsuario(username, password)) {
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        renderUserList();
      }
    });

    function abrirControle() {
      window.location.href = 'controle.html';
    }

    function logout() {
      sessionStorage.removeItem('controleUser');
      window.location.href = 'index.html';
    }

    (function() {
      const user = sessionStorage.getItem('controleUser');
      if (!user || user !== ownerUsername) {
        window.location.href = 'index.html';
        return;
      }

      initializeUsers();
      document.getElementById('userInfo').innerText = 'Logado como: ' + user;
      renderUserList();
    })();
  </script>
</body>
</html>
